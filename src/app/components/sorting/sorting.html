@if(sortingService.isSortingActive())
{<div class="card" style="position: relative;">
  <label for="search">
    <div style="width: 10px;">
      <app-searchbar-component></app-searchbar-component>
    </div>
  </label>
  <label for="sort">
    <div>
      <button data-id="asc" type="button" (click)="sortingService.sortBy($event)">Ascending</button>
      <button data-id="dsc" type="button" (click)="sortingService.sortBy($event)">Descending</button>
    </div>
  </label>
</div>}
