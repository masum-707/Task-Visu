<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tasks</title>
    <link rel="stylesheet" href="css/tasks.css" />
  </head>
  <body>
    <header class="navbar">
      <p>User:<span id="currentUser">UserName</span></p>
      <button id="log-out">Logout</button>
    </header>
    <main>
      <div class="searchbar">
        <input id="searchbar" type="search" placeholder="Search..." />
        <button id="create-task">+New Task</button>
      </div>
      <h1 style="display: none" class="no-Task">No Task Available</h1>
      <div id="table-container">
        <div id="sorttype" class="sorttype">
          <button id="asc">Sortby Ascending</button>
          <br />
          <button id="dsc">Sortby Descending</button>
        </div>
        <button id="refresh" class="refresh">Refresh🗘</button>
        <table class="table">
          <thead id="table-head">
            <th>Active</th>
            <th id="task-id" class="sortField">ID</th>
            <th id="task-name" class="sortField">Task Name</th>
            <th>Description</th>
            <th>Responsible</th>
            <th>Creator</th>
            <th>Priority</th>
            <th id="end-date" class="sortField">End Date</th>
            <th id="completion" class="sortField">Completion</th>
            <th>OverDue</th>
            <th>Action</th>
          </thead>
          <tbody id="tablebody"></tbody>
        </table>
        <div class="footer">
          <p>Total tasks: <span id="total-task"></span></p>
          <div>
            <button id="previous-btn">Previous</button> page:
            <span id="current-page"></span>
            <button id="next-btn">Next</button>
          </div>
        </div>
      </div>
      <div id="form-container" style="display: none" class="formContainer">
        <h1>Task Information</h1>
        <form id="task-Form">
          <div>
            <label for="taskname">Task Name</label>
            <input type="text" id="taskname" required />
            <br />
            <span id="tasknameErro" class="errorText"></span>
          </div>
          <div>
            <label for="ActiveStatus">isActive</label>
            <select id="ActiveStatus" required>
              <option value="1">TRUE</option>
              <option value="0">FALSE</option>
            </select>
            <span id="statusError" class="errorText"></span>
          </div>

          <div>
            <label for="completionfield">completion</label>
            <input
              id="completionfield"
              type="number"
              max="100"
              min="0"
              step="1"
              required
            />
            <br />
            <span id="completionError" class="errorText"></span>
          </div>
          <div>
            <label for="responsible">Responsible</label>
            <select id="responsible">
              <option value="">Select user</option>
            </select>

            <br />
            <span id="responsibleError" class="errorText"></span>
          </div>
          <div>
            <label for="startTime">Task Start</label>
            <input id="startTime" type="date" />
            <br />
            <span id="starttime-error" class="errorText"></span>
          </div>
          <div>
            <label for="endTime">Task End</label>
            <input id="endTime" type="date" />
            <br />
            <span id="endTime-error" class="errorText"></span>
          </div>
          <div>
            <label for="description_plain">Description</label>
            <input type="text" id="description_plain" />
          </div>
          <div>
            <label for="Task-Priority">Task Priority</label>
            <select id="Task-Priority">
              <option value="">Select Priority</option>
              <!-- <option value="2">LOW</option>
              <option value="3">MEDIUM</option>
              <option value="4">HIGH</option>
              <option value="5">URGENT</option> -->
            </select>
          </div>
          <button type="submit" id="submit">submit</button>
          <button id="cancel">cancel</button>
        </form>
      </div>
      <span id="Task-create" class="successful"></span>
    </main>
    <script type="module" src="js/task.list.js"></script>
    <script type="module" src="js/task.form.js"></script>
    <script type="module" src="js/utils.js"></script>
    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/task.service.js"></script>
    <script type="module" src="js/formValidation.js"></script>
    <script type="module" src="js/auth.js"></script>
  </body>
</html>
